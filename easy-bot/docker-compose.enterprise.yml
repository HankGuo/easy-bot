version: '3.8'

# ==============================================================================
# EasyBot Industrial-Grade Turnkey Orchestration
# Powered by Big-Tech Authoritative Open Source Upstream Stacks:
# - MicroVM Sandboxing: TencentCloud CubeSandbox (KVM/RustVMM MicroVMs)
# - Enterprise Hybrid RAG: Tencent WeKnora (ParadeDB BM25 + pgvector + Docreader)
# - Multi-Platform IM & Multi-Agent: TencentCloud Octop Platform
# - Protocols: Anthropic Model Context Protocol (MCP) Official SDK
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. EasyBot Core Agent Operating System
  # ----------------------------------------------------------------------------
  easybot-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easybot-core
    restart: unless-stopped
    ports:
      - "${PORT:-4100}:4100"
    environment:
      - NODE_ENV=production
      - PORT=4100
      - EASYBOT_PACKS=${EASYBOT_PACKS:-generic}
      - CUBESANDBOX_URL=${CUBESANDBOX_URL:-http://cubesandbox-api:3000}
      - CUBESANDBOX_API_KEY=${CUBESANDBOX_API_KEY:-}
      - CUBE_TEMPLATE_ID=${CUBE_TEMPLATE_ID:-default-node20}
      - WEKNORA_URL=http://weknora-app:8000
      - WEKNORA_API_KEY=${WEKNORA_API_KEY:-}
      - OCTOP_GATEWAY_URL=http://octop-platform:8088
      - OCTOP_API_KEY=${OCTOP_API_KEY:-}
      - EASYBOT_DATA_DIR=/app/data
      - EASYBOT_ADMIN_PASSWORD=${EASYBOT_ADMIN_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    volumes:
      - easybot-data:/app/data
      - easybot-workspaces:/app/workspaces
    depends_on:
      - cubesandbox-api
      - weknora-app
      - octop-platform
      - postgres
      - redis
    networks:
      - easybot-internal-net

  # ----------------------------------------------------------------------------
  # 2. TencentCloud CubeSandbox MicroVM Server (Official Port 3000 & KVM)
  #    Repository: github.com/TencentCloud/CubeSandbox
  # ----------------------------------------------------------------------------
  cubesandbox-api:
    image: tencentcloud/cubesandbox:latest
    container_name: cubesandbox-api
    restart: unless-stopped
    ports:
      - "${CUBESANDBOX_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - CUBE_TEMPLATE_ID=${CUBE_TEMPLATE_ID:-default-node20}
      - API_KEY=${CUBESANDBOX_API_KEY:-}
    devices:
      - "/dev/kvm:/dev/kvm"
    volumes:
      - cubedata:/data
    networks:
      - easybot-internal-net

  # ----------------------------------------------------------------------------
  # 3. Tencent WeKnora Enterprise RAG Subsystem (Official Upstream Images)
  #    Repository: github.com/Tencent/WeKnora
  # ----------------------------------------------------------------------------
  weknora-app:
    image: wechatopenai/weknora-app:latest
    container_name: weknora-app
    restart: unless-stopped
    ports:
      - "${WEKNORA_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=weknora
      - DB_PASSWORD=${WEKNORA_DB_PASSWORD:-weknora_secure_pass_2026}
      - DB_NAME=weknora
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_pass_2026}
      - EMBEDDING_MODEL=${WEKNORA_EMBEDDING_MODEL:-bge-large-zh-v1.5}
    depends_on:
      - postgres
      - redis
    networks:
      - easybot-internal-net

  weknora-docreader:
    image: wechatopenai/weknora-docreader:latest
    container_name: weknora-docreader
    restart: unless-stopped
    environment:
      - OCR_ENABLED=true
      - PARSER_WORKERS=4
    networks:
      - easybot-internal-net

  # ----------------------------------------------------------------------------
  # 4. TencentCloud Octop Multi-Agent & Channel Platform
  #    Repository: github.com/TencentCloud/Octop
  # ----------------------------------------------------------------------------
  octop-platform:
    image: ghcr.io/tencentcloud/octop:latest
    container_name: octop-platform
    restart: unless-stopped
    ports:
      - "${OCTOP_PORT:-8088}:8088"
    environment:
      - OCTOP_PORT=8088
      - OCTOP_DATABASE_URL=postgresql://octop:${OCTOP_DB_PASSWORD:-octop_secure_pass_2026}@postgres:5432/octop
      - OCTOP_REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/1
      - OCTOP_ACCESS_TOKEN_TTL=86400
      - WECOM_CORP_ID=${WECOM_CORP_ID:-}
      - WECOM_AGENT_SECRET=${WECOM_AGENT_SECRET:-}
      - DINGTALK_APP_KEY=${DINGTALK_APP_KEY:-}
      - DINGTALK_APP_SECRET=${DINGTALK_APP_SECRET:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
    volumes:
      - octop-data:/data/.octop
    depends_on:
      - postgres
      - redis
    networks:
      - easybot-internal-net

  # ----------------------------------------------------------------------------
  # 5. ParadeDB / pgvector PostgreSQL Infrastructure (Internal Isolated)
  # ----------------------------------------------------------------------------
  postgres:
    image: paradedb/paradedb:latest
    container_name: easybot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-easybot_root_pass_2026}
      - POSTGRES_DB=easybot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql:ro
    networks:
      - easybot-internal-net

  # ----------------------------------------------------------------------------
  # 6. Redis In-Memory Cache & Message Broker (Internal Isolated)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: easybot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secure_pass_2026}"]
    volumes:
      - redisdata:/data
    networks:
      - easybot-internal-net

volumes:
  easybot-data:
  easybot-workspaces:
  cubedata:
  octop-data:
  pgdata:
  redisdata:

networks:
  easybot-internal-net:
    driver: bridge
