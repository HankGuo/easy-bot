version: '3.8'

services:
  # 1. EasyBot Core Agent Operating System
  easybot-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easybot-core
    restart: unless-stopped
    ports:
      - "${PORT:-4100}:4100"
    environment:
      - NODE_ENV=production
      - PORT=4100
      - EASYBOT_PACKS=${EASYBOT_PACKS:-generic}
      - CUBESANDBOX_URL=http://cubesandbox:49982
      - WEKNORA_URL=http://weknora:8000
      - OCTOP_GATEWAY_URL=http://octop-gateway:5000
      - EASYBOT_DATA_DIR=/app/data
      - EASYBOT_ADMIN_PASSWORD=${EASYBOT_ADMIN_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
    volumes:
      - easybot-data:/app/data
      - easybot-workspaces:/app/workspaces
    depends_on:
      - cubesandbox
      - weknora
      - octop-gateway
      - postgres
      - redis
    networks:
      - easybot-net

  # 2. TencentCloud CubeSandbox (RustVMM + KVM MicroVM Sandbox)
  cubesandbox:
    image: tencentcloud/cubesandbox:latest
    container_name: easybot-cubesandbox
    restart: unless-stopped
    privileged: true
    ports:
      - "49982:49982"
    environment:
      - CUBE_PORT=49982
      - CUBE_ISOLATION_LEVEL=microvm
      - CUBE_MAX_SANDBOXES=64
      - CUBE_DEFAULT_TIMEOUT_SEC=120
    volumes:
      - /dev/kvm:/dev/kvm
      - cube-sandboxes:/var/lib/cubesandbox
    networks:
      - easybot-net

  # 3. Tencent WeKnora (Enterprise RAG + ParadeDB BM25 + pgvector + GraphRAG)
  weknora:
    image: tencent/weknora:latest
    container_name: easybot-weknora
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=weknora
      - DB_PASSWORD=weknorapass
      - DB_NAME=weknora
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EMBEDDING_MODEL=${WEKNORA_EMBEDDING_MODEL:-bge-large-zh-v1.5}
    depends_on:
      - postgres
      - redis
    networks:
      - easybot-net

  # 4. TencentCloud Octop Gateway (Multi-Platform Enterprise IM Bridge)
  octop-gateway:
    image: tencentcloud/octop-gateway:latest
    container_name: easybot-octop-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - GATEWAY_PORT=5000
      - EASYBOT_CALLBACK_URL=http://easybot-core:4100/api/v1/im/inbound
      - WECOM_CORP_ID=${WECOM_CORP_ID:-}
      - WECOM_AGENT_SECRET=${WECOM_AGENT_SECRET:-}
      - DINGTALK_APP_KEY=${DINGTALK_APP_KEY:-}
      - DINGTALK_APP_SECRET=${DINGTALK_APP_SECRET:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
    networks:
      - easybot-net

  # 5. ParadeDB / pgvector PostgreSQL Infrastructure
  postgres:
    image: paradedb/paradedb:latest
    container_name: easybot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=easybot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql:ro
    networks:
      - easybot-net

  # 6. Redis In-Memory Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: easybot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - easybot-net

volumes:
  easybot-data:
  easybot-workspaces:
  cube-sandboxes:
  pgdata:
  redisdata:

networks:
  easybot-net:
    driver: bridge
